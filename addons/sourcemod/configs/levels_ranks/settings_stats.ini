"LR_Settings"
{
	// Parameters changed here can be reloaded on the server with the console command ( sm_lvl_reload ) or from the Admin Panel in the plugin menu, without restarting the server.

	// Cumulative system.
	"Funded_System"
	{
		// To disable experience points for a specific action, write 0 in the parameter.
		// How many experience points the player:

		"lr_kill"			        "5"		// receives for a kill
		"lr_kill_is_bot"			"5"		// receives for killing a bot
		"lr_death"			        "5"		// loses on death
		"lr_death_is_bot"			"5"		// loses on death caused by a bot
		"lr_headshot"				"1"		// receives for a headshot kill
		"lr_assist"			        "1"		// receives for an assist
		"lr_suicide"				"6"		// loses on suicide
		"lr_teamkill"				"6"		// loses for killing a teammate
		"lr_winround"				"2"		// receives for winning a round
		"lr_loseround"				"2"		// loses for losing a round
		"lr_bombplanted"			"2"		// receives for planting the bomb
		"lr_bombdefused"			"2"		// receives for defusing the bomb
		"lr_bombdropped"			"1"		// loses for dropping the bomb
		"lr_bombpickup"				"1"		// receives for picking up the bomb
		"lr_hostagekilled"			"4"		// loses for killing a hostage
		"lr_hostagerescued"			"3"		// receives for rescuing a hostage
	}

	// Rating system (extended).
	"Rating_Extended"
	{
		// Experience point deduction coefficient when a player dies (use at your own risk, as it strongly affects how players are distributed across ranks)
		//
		// Maximum: 1.20 - the player loses 20 percent more than the killer receives (almost impossible to reach the highest ranks)
		// Default: 1.00 - the player loses as many experience points as the killer receives
		// Minimum: 0.80 - the player loses only 80 percent of the real value (reaching the highest ranks becomes much easier)
		//
		"lr_killcoeff"				"1.00"		// Recommended value: 1.04 (theoretically).

		// To disable experience points for a specific action, write 0 in the parameter.
		// How many experience points the player:

		"lr_headshot"				"1"		// receives for a headshot kill
		"lr_assist"				    "1"		// receives for an assist
		"lr_suicide"				"10"    // loses on suicide
		"lr_teamkill"				"5"		// loses for killing a teammate
		"lr_winround"				"2"		// receives for winning a round
		"lr_loseround"				"2"		// loses for losing a round
		"lr_bombplanted"			"3"		// receives for planting the bomb
		"lr_bombdefused"			"3"		// receives for defusing the bomb
		"lr_bombdropped"			"2"		// loses for dropping the bomb
		"lr_bombpickup"				"2"		// receives for picking up the bomb
		"lr_hostagekilled"			"20"    // loses for killing a hostage
		"lr_hostagerescued"			"5"		// receives for rescuing a hostage
	}

	// Rating system (simple).
	"Rating_Simple"
	{
		// To disable experience points for a specific action, write 0 in the parameter.
		// How many experience points the player:

		"lr_headshot"				"1"		// receives for a headshot kill
		"lr_assist"			        "1"     // receives for an assist
		"lr_suicide"				"0"		// loses on suicide
		"lr_teamkill"				"0"		// loses for killing a teammate
		"lr_winround"				"2"		// receives for winning a round
		"lr_loseround"				"2"		// loses for losing a round
		"lr_bombplanted"			"2"		// receives for planting the bomb
		"lr_bombdefused"			"2"		// receives for defusing the bomb
		"lr_bombdropped"			"1"		// loses for dropping the bomb
		"lr_bombpickup"				"1"		// receives for picking up the bomb
		"lr_hostagekilled"			"0"		// loses for killing a hostage
		"lr_hostagerescued"			"2"		// receives for rescuing a hostage
	}

	// Kill streaks.
	"Special_Bonuses"
	{
		// Only for [ Funded_System ] and [ Rating_Extended ]
		// To disable experience points for a specific action, write 0 in the parameter.

		"lr_bonus_1"			"2"		// DoubleKill
		"lr_bonus_2"			"3"		// TripleKill
		"lr_bonus_3"			"4"		// Domination
		"lr_bonus_4"			"5"		// Rampage
		"lr_bonus_5"			"6"		// MegaKill
		"lr_bonus_6"			"7"		// Ownage
		"lr_bonus_7"			"8"		// UltraKill
		"lr_bonus_8"			"9"		// KillingSpree
		"lr_bonus_9"			"10"    // MonsterKill
		"lr_bonus_10"			"11"    // Unstoppable
		"lr_bonus_11"			"12"    // GodLike
	}
}
