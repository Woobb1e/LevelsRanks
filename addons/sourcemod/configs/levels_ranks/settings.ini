"LR_Settings"
{
	// If the parameters you want to change are marked with this sign (***), restarting the plugin is required to apply changes.
	// The remaining parameters you change here can be updated on the server via the console command ( sm_lvl_reload ) or from the Admin Panel in the plugin menu, without restarting the plugin.

	"MainSettings"
	{
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		//
		//	(***) The name of the table in the database (Latin letters only, maximum 32 characters).
		//		If you have multiple servers in your project but want each server to have its own statistics, change the table name to a different one.
		//		Necessary for cases when you store different statistics in the same database.
		//
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		"lr_table" "lvl_base"

		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		//
		//	(***) Choose the statistics type
		//
		//		0 - Cumulative system.
		//		The player's rank will gradually increase, starting from the first rank.
		//
		//		1 - Rating system (extended).
		//		This system of calculating experience points for players is based on the players' skill level (similar to HlStats).
		//
		//		2 - Rating system (simple).
		//		This system of calculating experience points is analogous to the RankMe calculation system.
		//
		//		If you want to change the statistics type, completely reset the statistics data in the Database.
		//
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		"lr_type_statistics" "0"

		// Which flags must an admin have to access the Admin Panel?
		"lr_flag_adminmenu" "z"

		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		//
		//		What should the plugin menu Title be? Intended for more advanced projects
		//		that like to customize their servers.
		//
		//		ATTENTION: all chat prefixes (Example: [LR]) can also be changed in the translation file.
		//
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		"lr_plugin_title" "Levels Ranks"

		// Play sounds for rank up/down? [ 0 - no, 1 - yes ]
		"lr_sound" "0"

		// Path to the sound file to play upon ranking up (specify without sound/).
		"lr_sound_lvlup" "levels_ranks/levelup.mp3"

		// Path to the sound file to play upon ranking down (specify without sound/).
		"lr_sound_lvldown" "levels_ranks/leveldown.mp3"

		// Minimum number of players required to award experience points.
		// The number of players is checked at the start of the round.
		"lr_minplayers_count" "0"

		// Enable the ability for players to reset their stats in the 'Statistics' menu? [ 0 - no, 1 - yes ].
		"lr_show_resetmystats" "1"

		// How many seconds must pass before a player can reset their stats again?
		"lr_resetmystats_cooldown"	"86400"

		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		//
		//		How should messages about receiving experience points be shown to the player?
		//
		//		0 - do not show
		//		1 - show for every player action
		//		2 - show total change at the end of the round
		//
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		"lr_show_usualmessage" "1"

		// Show plugin messages on every spawn? [ 0 - no, 1 - yes ]
		"lr_show_spawnmessage" "0"

		// Show messages to everyone when someone ranks up? [ 0 - no, 1 - yes ]
		"lr_show_levelup_message" "1"

		// Show messages to everyone when someone ranks down? [ 0 - no, 1 - yes ]
		"lr_show_leveldown_message" "1"

		// Show everyone a message about the player's position after they type the rank command? [ 0 - no, 1 - yes ]
		"lr_show_rankmessage" "1"

		// Show the 'All ranks' item in the statistics menu? [ 0 - no, 1 - yes ]
		"lr_show_ranklist" "1"

		// Allow players to gain/lose experience points after the round ends? [ 0 - no, 1 - yes ]
		"lr_giveexp_roundend" "1"

		// Count killing teammates as TeamKill? [ 0 - yes, 1 - no (needed for 'Free For All' servers) ]
		"lr_allagainst_all" "0"

		// How many days must a player be absent to be hidden from statistics?
		// If you want to disable automatic hiding, set the value to 0.
		"lr_cleandb_days" "30"

		// Hide a player from statistics if they were banned? [ 0 - no, 1 - yes ]
		"lr_cleandb_banclient" "1"

		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		//
		//		How to save player data?
		//
		//		0 - only upon leaving the server
		//		Recommended to reduce the load on WEB-hosting with a large number of game servers or events
		//
		//		1 - upon leaving the server, ranking up/down, at the end of the round if alive, or upon death
		//		Recommended for keeping data up-to-date
		//
		//////////////////////////////////////////////////////////////////////////////////////////////////////////
		"lr_db_savedataplayer_mode" "1"
		
		// (***) Write 4-byte characters (using utf8mb4 encoding) from player nicknames into the MySQL database? [ 0 - utf8 will be used, 1 - yes ]
		// Some WEB hostings do not provide support for utf8mb4 encoding for MySQL databases or have issues with it.
		"lr_db_allow_utf8mb4" "1"
		
		// (***) Encoding type in the table.
		// 0 - utf8(mb4)_general_ci .
		// 1 - utf8(mb4)_unicode_ci (Recommended for MySQL 8.0+).
		"lr_db_character_type" "0"
	}
}