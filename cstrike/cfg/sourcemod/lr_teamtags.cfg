// ConVars for plugin "levelsranks_tag.smx"

//-----------------------(Team Tag Settings)------------------------------
  
// CT message color
sm_lr_tags_color_ct_msg "default"


// CT player name color
sm_lr_tags_color_ct_name "blue"


// CT tag color
sm_lr_tags_color_ct_tag "blue"

//______________________________________________________

// SPEC message color
sm_lr_tags_color_spec_msg "default"


// SPEC player name color
sm_lr_tags_color_spec_name "#ab7bfa"


// SPEC tag color `[SPEC]`
sm_lr_tags_color_spec_tag "#8439fd"

//______________________________________________________

// T message color
sm_lr_tags_color_t_msg "default"


// T player name color `[T] {playername}`
sm_lr_tags_color_t_name "red"

// T tag color `[T]`
sm_lr_tags_color_t_tag "red"

//______________________________________________________

// (TEAM) text color
sm_lr_tags_color_teamtext "lightgreen"

// Team tag position
// Values:
// "before_name" = [Rank 1] [CT] Player : hello
// "after_name"  = [Rank 1] Player [CT] : hello
sm_lr_tags_teamtag_position "before_name"

//-------------------------(Plugin Settings)-----------------------------------

// Enable plugin
sm_lr_tags_enable "1"

// Enable general chat formatting
sm_lr_tags_general "1"


// Enable team chat formatting
sm_lr_tags_teamchat "1"


// Show Levels Ranks tag  
sm_lr_tags_show_rank "0"


// Shows the team tag `[T] / [CT] / [SPEC]` in chat.
sm_lr_tags_show_teamtag "1"

// Show `(TEAM)` in team chat
sm_lr_tags_show_teamtext "1"

// Default message color
sm_lr_tags_color_default_msg "default"

//-----------------------(Separator Settings)----------------------------------

// Show separator between rank tag and team tag
sm_lr_tags_show_rank_team_separator "0"

// Show separator between team tag and player name
sm_lr_tags_show_name_team_separator "0"

// Legacy separator between rank tag and team tag
sm_lr_tags_separator "-"

// Separator between rank tag and team tag
sm_lr_tags_rank_team_separator "-"

// Separator between team tag and player name
sm_lr_tags_name_team_separator "-"
